<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="NOAH Cloud — enterprise media asset management. Find anything, review on the timeline, and share finished work from one library." />
    <title>NOAH Cloud — A library worthy of your beautiful work</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('noah-theme-preference');
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              document.documentElement.dataset.theme === 'light' ? '#f4f5f9' : '#121212',
            );
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
